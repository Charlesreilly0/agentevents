[project]
name = "agentevents"
version = "0.1.0"
description = "Event-driven communication between agents: a pub/sub EventBus and typed Event model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "redis>=5.0",
]

[project.scripts]
agentevents = "agentevents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentevents"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[redis]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker to run a real backend via testcontainers",
]
