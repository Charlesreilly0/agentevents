[project]
name = "agentevents"
version = "0.1.0"
description = "Event-driven communication between agents: a pub/sub EventBus and typed Event model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "redis>=5.0",
]

[project.scripts]
agentevents = "agentevents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentevents"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "testcontainers[redis]>=4.15.0",
    "ty>=0.0.69",
]
examples = [
    "pydantic-ai>=2.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker to run a real backend via testcontainers",
]

[tool.coverage.run]
source = ["src/agentevents"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["examples/**"]
