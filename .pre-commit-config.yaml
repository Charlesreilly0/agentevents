repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest (unit tests)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-integration-coverage
        name: pytest (unit + integration, coverage >= 80%)
        entry: uv run pytest -m "" --cov=agentevents --cov-report=term-missing --cov-fail-under=80
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: build
        name: build (sdist + wheel)
        entry: uv build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
